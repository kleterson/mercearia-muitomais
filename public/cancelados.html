<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>Pedidos Cancelados</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
          --primary: #f59e0b;
          --primary-dark: #d97706;
          --success: #10b981;
          --danger: #ef4444;
          --bg-color: #0f172a;
          --card-bg: #1e293b;
          --card-bg-alt: #334155;
          --text-main: #f8fafc;
          --text-muted: #94a3b8;
          --border-color: #334155;
          --radius: 14px;
          --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        
        body { 
          padding: 16px; 
          background-color: var(--bg-color); 
          background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
          color: var(--text-main); 
          min-height: 100vh;
          max-width: 480px;
          margin: 0 auto;
        }
        
        .header-bar { 
          display: flex; 
          justify-content: space-between; 
          align-items: center; 
          margin-bottom: 20px; 
          background: var(--card-bg);
          padding: 14px 18px;
          border-radius: var(--radius);
          box-shadow: var(--shadow);
          border: 1px solid var(--border-color);
        }

        .header-bar h1 {
          font-size: 18px;
          font-weight: 700;
          letter-spacing: -0.5px;
          display: flex;
          align-items: center;
          gap: 8px;
        }
        
        /* Botão Voltar */
        .btn-voltar { 
          background: var(--card-bg-alt); 
          color: var(--text-main); 
          border: 1px solid var(--border-color); 
          padding: 8px 12px; 
          border-radius: 10px; 
          font-weight: 600; 
          cursor: pointer; 
          text-decoration: none; 
          display: flex; 
          align-items: center; 
          gap: 6px;
          font-size: 13px;
          transition: background 0.2s;
        }
        .btn-voltar:hover { background: #475569; }

        /* Cards de Pedidos Cancelados */
        .card { 
          background: var(--card-bg); 
          border-left: 5px solid var(--danger); 
          padding: 18px; 
          border-radius: var(--radius); 
          margin-bottom: 16px; 
          box-shadow: var(--shadow);
          border-top: 1px solid var(--border-color);
          border-right: 1px solid var(--border-color);
          border-bottom: 1px solid var(--border-color);
        }

        .card h2 {
          color: var(--text-main);
          font-size: 18px;
          margin-bottom: 10px;
          border-bottom: 1px solid var(--border-color);
          padding-bottom: 8px;
        }

        .card p {
          font-size: 14px;
          color: var(--text-muted);
          margin-bottom: 6px;
          line-height: 1.4;
        }

        .card p strong {
          color: var(--text-main);
        }

        .status-badge { 
          background: rgba(239, 68, 68, 0.15); 
          color: #fca5a5; 
          padding: 6px 12px; 
          border-radius: 8px; 
          display: inline-block; 
          margin-top: 10px; 
          font-weight: 600; 
          font-size: 13px;
          border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

  <div class="header-bar">
    <h1>❌ Cancelados</h1>
    <a href="motoboy.html" class="btn-voltar">⬅ Voltar</a>
  </div>

  <div id="lista-cancelados" style="margin-top: 10px;">
    <p style="color:var(--text-muted); font-size:14px; background:var(--card-bg); padding:20px; border-radius:var(--radius); text-align:center; border:1px solid var(--border-color);">Carregando pedidos cancelados...</p>
  </div>

  <script>
    const socket = io();

    async function carregarCancelados() {
      try {
        const res = await fetch('/api/pedidos');
        const pedidos = await res.json();
        
        // Filtra apenas os pedidos que possuem status de cancelado
        const cancelados = pedidos.filter(p => p.status === 'Cancelado pelo Cliente');
        
        const container = document.getElementById('lista-cancelados');
        container.innerHTML = '';
        
        if (cancelados.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted); font-size:14px; background:var(--card-bg); padding:20px; border-radius:var(--radius); text-align:center; border:1px solid var(--border-color);">Nenhum pedido cancelado no momento.</p>';
        } else {
          cancelados.reverse().forEach(p => {
            const formaPag = p.pagamento || p.formaPagamento || 'Não especificado';
            const infoTroco = p.troco ? ` - Troco: ${p.troco}` : '';
            
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
              <h2>Pedido #${p.id}</h2>
              <p><strong>Cliente:</strong> ${p.cliente}</p>
              <p><strong>Endereço:</strong> ${p.endereco}</p>
              <p><strong>Valor:</strong> R$ ${Number(p.total).toFixed(2)}</p>
              <p><strong>Pagamento:</strong> <span style="color: var(--primary); font-weight: 600;">${formaPag}${infoTroco}</span></p>
              <div class="status-badge">${p.status}</div>
            `;
            container.appendChild(div);
          });
        }
      } catch (error) {
        console.error('Erro ao carregar cancelados:', error);
      }
    }

    // Atualiza em tempo real se houver novo cancelamento via socket
    socket.on('status_atualizado', (p) => {
      carregarCancelados();
    });

    socket.on('pedido_disponivel_motoboy', () => {
      carregarCancelados();
    });

    carregarCancelados();
  </script>
</body>
</html>
