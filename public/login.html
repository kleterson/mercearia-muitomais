<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Informa ao celular que o site deve se comportar como aplicativo -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <title>Acesso ao Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #10b981;
        --primary-dark: #059669;
        --bg-color: #0f172a;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --radius: 16px;
        --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
      }

      * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }

      body {
        background-color: var(--bg-color);
        background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        padding: 16px;
      }

      .card-login {
        background: var(--card-bg);
        padding: 36px 30px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 380px;
        text-align: center;
        animation: fadeIn 0.3s ease-out;
        position: relative;
        overflow: hidden;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .card-login h2 {
        margin-bottom: 24px;
        color: var(--text-main);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        box-sizing: border-box;
        font-size: 14px;
        background: #f8fafc;
        color: var(--text-main);
        transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      }

      input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        background: #ffffff;
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        font-size: 15px;
        transition: background-color 0.2s, transform 0.1s;
        margin-top: 4px;
      }

      button:hover {
        background-color: var(--primary-dark);
      }

      button:active {
        transform: scale(0.98);
      }

      a {
        display: inline-block;
        margin-top: 20px;
        color: var(--primary);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: color 0.2s;
      }

      a:hover {
        color: var(--primary-dark);
        text-decoration: underline;
      }

      /* Estilo para a mensagem na tela */
      #mensagem-status {
        display: none;
        margin-bottom: 20px;
        padding: 12px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        animation: fadeIn 0.2s ease-out;
      }
      .mensagem-sucesso {
        background-color: #ecfdf5;
        color: #065f46;
        border: 1px solid #a7f3d0;
      }
      .mensagem-erro {
        background-color: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }
    </style>
</head>
<body>

  <div class="card-login">
    <h2 id="titulo-form">Entrar no Site</h2>
    <div id="mensagem-status"></div>
    <form id="form-auth" autocomplete="off">
      <input type="text" id="usuario" placeholder="Nome de Usuário" autocomplete="off" required>
      <input type="password" id="senha" placeholder="Sua Senha" autocomplete="new-password" required>
      <button type="submit" id="btn-submit">Entrar</button>
    </form>
    <a id="toggle-modo">Não tem conta? Cadastre-se</a>
  </div>

  <script>
    let modoCadastro = false;

    const tituloForm = document.getElementById('titulo-form');
    const btnSubmit = document.getElementById('btn-submit');
    const toggleModo = document.getElementById('toggle-modo');
    const formAuth = document.getElementById('form-auth');
    const msgStatus = document.getElementById('mensagem-status');

    function exibirMensagem(texto, tipo) {
      msgStatus.textContent = texto;
      msgStatus.className = tipo === 'sucesso' ? 'mensagem-sucesso' : 'mensagem-erro';
      msgStatus.style.display = 'block';
    }

    // Alterna a interface entre Login e Cadastro
    toggleModo.addEventListener('click', (e) => {
      e.preventDefault();
      modoCadastro = !modoCadastro;
      msgStatus.style.display = 'none';

      if (modoCadastro) {
        tituloForm.textContent = 'Cadastrar Conta';
        btnSubmit.textContent = 'Cadastrar';
        toggleModo.textContent = 'Já tem uma conta? Faça Login';
      } else {
        tituloForm.textContent = 'Entrar no Site';
        btnSubmit.textContent = 'Entrar';
        toggleModo.textContent = 'Não tem conta? Cadastre-se';
      }
    });

    // Processa o envio do formulário
    formAuth.addEventListener('submit', async (e) => {
      e.preventDefault();

      const usuario = document.getElementById('usuario').value;
      const senha = document.getElementById('senha').value;

      // Define a Rota de acordo com o modo ativo
      const endpoint = modoCadastro ? '/api/cadastro' : '/api/login';

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, senha })
        });

        const data = await response.json();

        if (response.ok) {
          if (modoCadastro) {
            exibirMensagem('Cadastro realizado com sucesso! Redirecionando...', 'sucesso');
            setTimeout(() => {
              msgStatus.style.display = 'none';
              toggleModo.click(); // Volta para a tela de login
            }, 1500);
          } else {
            exibirMensagem('Login efetuado com sucesso! Entrando...', 'sucesso');
            // Guarda o nome do usuário no navegador (opcional)
            localStorage.setItem('usuarioLogado', usuario);
            // Redireciona automaticamente após 1 segundo
            setTimeout(() => {
              window.location.href = '/index.html';
            }, 1000);
          }
        } else {
          exibirMensagem(data.mensagem || 'Ocorreu um erro no servidor.', 'erro');
        }
      } catch (err) {
        console.error(err);
        exibirMensagem('Erro ao conectar com o servidor.', 'erro');
      }
    });
  </script>

</body>
</html>
