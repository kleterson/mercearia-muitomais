<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Informa ao celular que o site deve se comportar como aplicativo -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <title>Mercearia Express</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #10b981;
        --primary-dark: #059669;
        --accent: #f59e0b;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --radius: 12px;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      }

      * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
      body { padding: 20px; background: var(--bg-color); color: var(--text-main); max-width: 1200px; margin: 0 auto; }

      .header-bar { 
        background: linear-gradient(135deg, #0f172a, #1e293b); 
        color: white; 
        padding: 20px 24px; 
        border-radius: var(--radius); 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 24px; 
        box-shadow: var(--shadow);
      }
      .header-bar h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
      .header-actions { display: flex; gap: 10px; align-items: center; }
      
      .btn-dash { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
      .btn-dash:hover { background: #2563eb; }
      .btn-sair { background: #ef4444; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
      .btn-sair:hover { background: #dc2626; }

      /* Modal Dashboard Cliente */
      #dash-cliente { display: none; background: var(--card-bg); border: 1px solid var(--border-color); padding: 24px; border-radius: var(--radius); margin-bottom: 24px; box-shadow: var(--shadow-lg); }
      .dash-metrics { display: flex; gap: 16px; margin: 16px 0; }
      .metric-card { flex: 1; background: #f1f5f9; padding: 16px; border-radius: 10px; text-align: center; border: 1px solid var(--border-color); }
      .metric-card small { color: var(--text-muted); font-weight: 500; font-size: 13px; }
      .metric-card h3 { font-size: 20px; margin-top: 4px; color: var(--text-main); }

      .filtros { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
      .btn-filtro { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s; box-shadow: var(--shadow); }
      .btn-filtro:hover { border-color: var(--text-muted); color: var(--text-main); }
      .btn-filtro.ativo { background: var(--primary); color: white; border-color: var(--primary); }

      .grid-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
      .card-produto { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 14px; text-align: center; box-shadow: var(--shadow); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
      .card-produto:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
      .card-produto img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #e2e8f0; }
      .badge-promo { background: var(--accent); color: white; font-size: 10px; padding: 3px 8px; border-radius: 20px; font-weight: 700; display: inline-block; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

      .btn-add { background: var(--primary); color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 12px; transition: background 0.2s; }
      .btn-add:hover { background: var(--primary-dark); }

      .box-status { background: #ecfdf5; border: 1px solid #a7f3d0; padding: 20px; border-radius: var(--radius); margin-bottom: 24px; box-shadow: var(--shadow); }
      .box-status h3 { color: #065f46; font-size: 18px; margin-bottom: 8px; }
      
      .box-carrinho { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); }
      
      .btn-remover-item { background: #fee2e2; color: #ef4444; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: background 0.2s; }
      .btn-remover-item:hover { background: #fecaca; }

      /* Estilização dos Modais e Carrinho Flutuante */
      .carrinho-flutuante {
        position: fixed !important;
        bottom: 24px !important;
        right: 24px !important;
        background-color: var(--primary) !important;
        color: white;
        padding: 16px 28px;
        border-radius: 50px;
        box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
        z-index: 999999 !important;
        cursor: pointer;
        font-weight: 700;
        font-size: 16px;
        transition: transform 0.2s, background-color 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .carrinho-flutuante:hover { transform: scale(1.05); background-color: var(--primary-dark) !important; }

      .modal-carrinho {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(4px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000000;
        padding: 16px;
      }

      .conteudo-modal {
        background: var(--card-bg);
        padding: 24px;
        border-radius: 16px;
        width: 100%;
        max-width: 440px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        animation: modalAppear 0.25s ease-out;
      }

      @keyframes modalAppear {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .input-campo {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        margin-bottom: 14px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
        background: #f8fafc;
        color: var(--text-main);
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .input-campo:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        background: #ffffff;
      }

      label { font-size: 13px; font-weight: 600; color: var(--text-muted); display: block; margin-top: 4px; }
    </style>
</head>
<body>

  <div class="header-bar">
    <h1>🛒 Mercado </h1>
    <div class="header-actions">
      <button class="btn-dash" onclick="window.location.href='historico.html'">📊 Minhas Compras</button>
      <button class="btn-sair" onclick="fazerLogout()">🚪 Sair</button>
    </div>
  </div>

  <!-- Dashboard Modal / Gaveta do Cliente -->
  <div id="dash-cliente">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h2 style="font-size: 18px;">📊 Seu Histórico de Compras</h2>
      <button onclick="alternarDashCliente()" style="background: transparent; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted);">✖</button>
    </div>

    <div class="dash-metrics">
      <div class="metric-card">
        <small>Total de Pedidos</small>
        <h3 id="cli-qtd-pedidos">0</h3>
      </div>
      <div class="metric-card">
        <small>Total Gasto</small>
        <h3 style="color: var(--primary);">R$ <span id="cli-total-gasto">0.00</span></h3>
      </div>
    </div>

    <h4 style="margin-bottom: 10px; font-size: 14px; color: var(--text-muted);">Suas Compras Anteriores:</h4>
    <div id="cli-lista-historico" style="font-size: 14px;">Nenhuma compra realizada ainda.</div>
  </div>

  <!-- Status do Pedido Atual (Sempre no topo quando ativo) -->
  <div class="box-status" id="box-status" style="display: none;">
    <h3>🛵 Status do Seu Pedido</h3>
    <p style="margin-top: 4px;"><strong id="status-pedido-id">Pedido #--</strong></p>
    <p style="margin-top: 2px;">Status Atual: <span id="status-pedido-texto" style="color: var(--accent); font-weight: bold;">--</span></p>
    <button id="btn-cancelar-pedido" onclick="tentarCancelarPedido()" style="background: #ef4444; color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 12px; width: 100%; transition: background 0.2s;">Cancelar Pedido ❌</button>
  </div>

  <!-- Modal do Bot de Cancelamento -->
  <div class="modal-carrinho" id="modal-bot-cancelar" style="display: none;">
    <div class="conteudo-modal">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="font-size: 18px;">Assistente Virtual 🤖</h2>
        <button onclick="fecharBotCancelar()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted);">✕</button>
      </div>
      <div id="conteudo-bot-chat" style="font-size: 14px; line-height: 1.5; color: var(--text-main);">
        <!-- Mensagens injetadas dinamicamente -->
      </div>
    </div>
  </div>

  <!-- Filtros -->
  <div class="filtros">
    <button class="btn-filtro ativo" onclick="filtrar('todos', this)">Todos</button>
    <button class="btn-filtro" onclick="filtrar('lacticinios', this)">Laticínios</button>
    <button class="btn-filtro" onclick="filtrar('limpeza', this)">Limpeza</button>
    <button class="btn-filtro" onclick="filtrar('mercearia', this)">Mercearia</button>
    <button class="btn-filtro" onclick="filtrar('feira', this)">Feira</button>
  </div>

  <!-- Produtos -->
  <div class="grid-produtos" id="grade-produtos"></div>

  <!-- Botão Flutuante do Carrinho -->
  <div class="carrinho-flutuante" id="btn-abrir-carrinho" onclick="toggleCarrinho()">
    🛒 Ver Carrinho (<span id="contador-carrinho">0</span>) - R$ <span id="total-carrinho">0.00</span>
  </div>

  <!-- Caixa / Painel do Carrinho (inicialmente oculto) -->
  <div class="modal-carrinho" id="painel-carrinho" style="display: none;">
    <div class="conteudo-modal">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="font-size: 18px;">Seu Carrinho</h2>
        <button onclick="toggleCarrinho()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted);">✕</button>
      </div>
      
      <div id="itens-carrinho" style="margin: 10px 0; max-height: 180px; overflow-y: auto;">
        <p style="color: var(--text-muted); font-size: 14px;">Carrinho vazio</p>
      </div>
      
      <div style="border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 16px; font-weight: 600; color: var(--text-muted);">Total:</span>
        <span style="font-size: 20px; font-weight: 700; color: var(--primary);">R$ <span id="total-carrinho-modal">0.00</span></span>
      </div>
      
      <div style="margin-top: 14px;">
        <label>Seu Nome:</label>
        <input type="text" id="nome-cliente" class="input-campo" placeholder="Seu nome">
        
        <label>Endereço de Entrega:</label>
        <input type="text" id="endereco-cliente" class="input-campo" placeholder="Ex: Rua das Flores, 123">

        <label>Forma de Pagamento:</label>
        <select id="forma-pagamento" class="input-campo" onchange="verificarTroco()">
          <option value="Pix">Pix</option>
          <option value="Cartao Debito/Credito">Cartão (Débito / Crédito)</option>
          <option value="Dinheiro">Dinheiro</option>
        </select>

        <!-- Campo de Troco Dinâmico -->
        <div id="bloco-troco" style="display: none;">
          <label>Troco para quanto? (Deixe em branco se não precisar):</label>
          <input type="text" id="troco-para" class="input-campo" placeholder="Ex: 50.00">
        </div>
      </div>
      
      <button class="btn-add" style="background: var(--primary); font-size: 16px; margin-top: 8px; padding: 12px;" onclick="finalizarPedido()">Finalizar Pedido</button>
    </div>
  </div>

  <script>
    // Variável para guardar o status atual do pedido ativo do cliente
    let statusPedidoAtual = '';

    // Função para abrir e fechar o painel do carrinho
    function toggleCarrinho() {
      const painel = document.getElementById('painel-carrinho');
      if (painel.style.display === 'none' || painel.style.display === '') {
        painel.style.display = 'flex';
      } else {
        painel.style.display = 'none';
      }
    }

    // Função para detectar dispositivo móvel
    function ehDispositivoMovel() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    if (ehDispositivoMovel()) {
      console.log("Rodando como app no celular!");
    }

    // Verificação de autenticação: se não houver usuário no localStorage, redireciona para login
    let clienteLogado = localStorage.getItem('usuarioLogado');
    if (!clienteLogado) {
      window.location.href = 'login.html';
    }

    const socket = typeof io !== 'undefined' ? io() : null;
    let listaProdutos = [];
    let carrinho = [];

    document.getElementById('nome-cliente').value = clienteLogado || '';

    // Função para buscar o pedido mais recente do usuário e manter o status na tela
    async function verificarPedidoAtivo() {
      const user = document.getElementById('nome-cliente').value.trim() || clienteLogado;
      try {
        const res = await fetch(`/api/pedidos?usuario=${user}`);
        if (res.ok) {
          const meusPedidos = await res.json();
          if (meusPedidos.length > 0) {
            const ultimoPedido = meusPedidos.sort((a, b) => b.id - a.id)[0];
            statusPedidoAtual = ultimoPedido.status;
            
            // Só exibe a caixa de status se o pedido não estiver Entregue e nem Cancelado pelo Cliente
            if (ultimoPedido.status !== 'Entregue' && ultimoPedido.status !== 'Cancelado pelo Cliente') {
              document.getElementById('box-status').style.display = 'block';
              document.getElementById('status-pedido-id').innerText = `Pedido #${ultimoPedido.id}`;
              document.getElementById('status-pedido-texto').innerText = ultimoPedido.status;
            } else {
              document.getElementById('box-status').style.display = 'none';
            }
          }
        }
      } catch (err) {
        console.error('Erro ao verificar pedido ativo', err);
      }
    }

    // Lógica do Bot de Cancelamento
    function tentarCancelarPedido() {
      const modal = document.getElementById('modal-bot-cancelar');
      const chatBox = document.getElementById('conteudo-bot-chat');
      modal.style.display = 'flex';

      // Se o comércio já aceitou (diferente de 'Aguardando Aprovação')
      if (statusPedidoAtual && statusPedidoAtual !== 'Aguardando Aprovação') {
        chatBox.innerHTML = `
          <p style="background: #f1f5f9; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border-color);">
            Olá sou assistente virtual 🤖, infelizmente não dá para cancelar, o restaurante já aceitou seu pedido.
          </p>
          <button onclick="fecharBotCancelar()" style="background: #3b82f6; color: white; border: none; padding: 10px 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: 600;">Entendido</button>
        `;
      } else {
        // Se ainda estiver aguardando aprovação
        chatBox.innerHTML = `
          <p style="background: #f1f5f9; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border-color);">
            Olá sou assistente virtual 🤖, qual motivo do cancelamento, escolha a opção abaixo:
          </p>
          <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;">
            <button onclick="escolherMotivoCancelamento(1)" style="background: #ffffff; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; text-align: left; cursor: pointer; font-weight: 500;">1 - Comprei sem querer</button>
            <button onclick="escolherMotivoCancelamento(2)" style="background: #ffffff; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; text-align: left; cursor: pointer; font-weight: 500;">2 - Não reconheço essa compra</button>
            <button onclick="escolherMotivoCancelamento(3)" style="background: #ffffff; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; text-align: left; cursor: pointer; font-weight: 500;">3 - Prefiro ir até o local</button>
          </div>
        `;
      }
    }

    function escolherMotivoCancelamento(opcao) {
      const user = document.getElementById('nome-cliente').value.trim() || clienteLogado;
      
      // Envia a alteração de status para o servidor salvar no banco de dados
      fetch(`/api/pedidos?usuario=${user}`)
        .then(res => res.json())
        .then(pedidos => {
          const ultimo = pedidos.sort((a, b) => b.id - a.id)[0];
          if (ultimo && socket) {
            socket.emit('atualizar_status_pedido', { id: ultimo.id, status: 'Cancelado pelo Cliente' });
          }
        });

      const chatBox = document.getElementById('conteudo-bot-chat');
      chatBox.innerHTML = `
        <p style="background: #f1f5f9; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border-color);">
          Sua compra foi cancelada com sucesso ✅
        </p>
        <p style="background: #f1f5f9; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border-color);">
          Por favor, avalie o atendimento com estrelinha de 0 a 5 ⭐:
        </p>
        <div style="display: flex; justify-content: center; gap: 6px; margin-bottom: 15px;">
          <button onclick="avaliarAtendimento(0)" style="background: #f59e0b; color:white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">0</button>
          <button onclick="avaliarAtendimento(1)" style="background: #f59e0b; color:white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">1</button>
          <button onclick="avaliarAtendimento(2)" style="background: #f59e0b; color:white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">2</button>
          <button onclick="avaliarAtendimento(3)" style="background: #f59e0b; color:white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">3</button>
          <button onclick="avaliarAtendimento(4)" style="background: #f59e0b; color:white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">4</button>
          <button onclick="avaliarAtendimento(5)" style="background: #f59e0b; color:white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">5</button>
        </div>
      `;
      // Esconde o painel de status pois foi cancelado permanentemente
      document.getElementById('box-status').style.display = 'none';
      statusPedidoAtual = 'Cancelado pelo Cliente';
    }

    function avaliarAtendimento(nota) {
      const chatBox = document.getElementById('conteudo-bot-chat');
      if (nota === 5) {
        chatBox.innerHTML = `
          <p style="background: #ecfdf5; border: 1px solid #a7f3d0; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: 600; color: #065f46;">
            Obrigado pelo feedback volte sempre 😊
          </p>
          <button onclick="fecharBotCancelar()" style="background: #3b82f6; color: white; border: none; padding: 10px 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: 600;">Fechar</button>
        `;
      } else if (nota >= 0 && nota <= 2) {
        chatBox.innerHTML = `
          <p style="background: #fee2e2; border: 1px solid #fecaca; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: 600; color: #991b1b;">
            Obrigado pelo atendimento, desculpa o transtorno 😢 e volte sempre.
          </p>
          <button onclick="fecharBotCancelar()" style="background: #3b82f6; color: white; border: none; padding: 10px 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: 600;">Fechar</button>
        `;
      } else {
        // Notas 3 e 4 por segurança seguem uma mensagem padrão amigável
        chatBox.innerHTML = `
          <p style="background: #f1f5f9; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: 600;">
            Obrigado pela avaliação! Volte sempre 🙂
          </p>
          <button onclick="fecharBotCancelar()" style="background: #3b82f6; color: white; border: none; padding: 10px 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: 600;">Fechar</button>
        `;
      }
    }

    function fecharBotCancelar() {
      document.getElementById('modal-bot-cancelar').style.display = 'none';
    }

    async function carregarProdutos() {
      try {
        const res = await fetch('/api/produtos');
        if (res.ok) {
          listaProdutos = await res.json();
        } else {
          listaProdutos = obterProdutosExemplo();
        }
      } catch (err) {
        console.warn('API de produtos indisponível, usando lista local de demonstração.');
        listaProdutos = obterProdutosExemplo();
      }
      renderizarProdutos(listaProdutos);
    }

    function obterProdutosExemplo() {
      return [
        { id: 1, nome: 'Leite Integral 1L', categoria: 'lacticinios', preco: 4.80, foto: 'https://via.placeholder.com/150', obs: 'Marca Boralact' },
        { id: 2, nome: 'Queijo Mussarela 200g', categoria: 'lacticinios', preco: 12.50, foto: 'https://via.placeholder.com/150', promocao: true },
        { id: 3, nome: 'Detergente Neutro 500ml', categoria: 'limpeza', preco: 2.30, foto: 'https://via.placeholder.com/150' },
        { id: 4, nome: 'Arroz Tipo 1 - 5kg', categoria: 'mercearia', preco: 24.90, foto: 'https://via.placeholder.com/150' },
        { id: 5, nome: 'Banana Prata 1kg', categoria: 'feira', preco: 6.99, foto: 'https://via.placeholder.com/150', promocao: true }
      ];
    }

    function renderizarProdutos(lista) {
      const container = document.getElementById('grade-produtos');
      if (!lista || lista.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 30px;">Nenhum produto encontrado nesta categoria.</p>';
        return;
      }

      container.innerHTML = lista.map(p => `
        <div class="card-produto">
          <div>
            <img src="${p.foto || 'https://via.placeholder.com/150'}" alt="${p.nome}">
            <h3 style="font-size: 15px; font-weight: 600; margin-top: 6px; color: var(--text-main);">${p.nome}</h3>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">${p.obs || ''}</p>
          </div>
          <div>
            <p style="font-size: 16px; font-weight: 700; margin: 8px 0; color: var(--primary);">R$ ${Number(p.preco).toFixed(2)}</p>
            ${p.promocao ? '<div><span class="badge-promo">PROMOÇÃO</span></div>' : ''}
            <button class="btn-add" onclick="adicionarCarrino(${p.id})">Adicionar</button>
          </div>
        </div>
      `).join('');
    }

    function filtrar(cat, btnElement) {
      if (btnElement) {
        document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('ativo'));
        btnElement.classList.add('ativo');
      }

      if (cat === 'todos') {
        renderizarProdutos(listaProdutos);
      } else {
        renderizarProdutos(listaProdutos.filter(p => p.categoria === cat));
      }
    }

    function adicionarCarrino(id) {
      const p = listaProdutos.find(item => item.id === id);
      if (p) {
        carrinho.push(p);
        atualizarCarrinho();
      }
    }

    function removerDoCarrinho(index) {
      carrinho.splice(index, 1);
      atualizarCarrinho();
    }

    function atualizarCarrinho() {
      const container = document.getElementById('itens-carrinho');
      
      document.getElementById('contador-carrinho').innerText = carrinho.length;
      const total = carrinho.reduce((acc, p) => acc + Number(p.preco), 0);
      document.getElementById('total-carrinho').innerText = total.toFixed(2);
      document.getElementById('total-carrinho-modal').innerText = total.toFixed(2);

      if (carrinho.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 10px;">Carrinho vazio</p>';
        return;
      }

      container.innerHTML = carrinho.map((p, index) => `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px;">
          <span style="font-size: 14px; font-weight: 500;">${p.nome}</span>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 14px; font-weight: 600; color: var(--primary);">R$ ${Number(p.preco).toFixed(2)}</span>
            <button class="btn-remover-item" onclick="removerDoCarrinho(${index})">✕</button>
          </div>
        </div>
      `).join('');
    }

    function verificarTroco() {
      const forma = document.getElementById('forma-pagamento').value;
      const blocoTroco = document.getElementById('bloco-troco');
      if (forma === 'Dinheiro') {
        blocoTroco.style.display = 'block';
      } else {
        blocoTroco.style.display = 'none';
        document.getElementById('troco-para').value = '';
      }
    }

    function finalizarPedido() {
      const cliente = document.getElementById('nome-cliente').value.trim();
      const endereco = document.getElementById('endereco-cliente').value.trim();
      const formaPagamento = document.getElementById('forma-pagamento').value;
      const trocoPara = document.getElementById('troco-para').value.trim();

      if (!cliente || !endereco || carrinho.length === 0) {
        alert('Preencha seu nome, endereço e adicione itens ao carrinho!');
        return;
      }

      localStorage.setItem('usuarioLogado', cliente);
      clienteLogado = cliente;

      const total = carrinho.reduce((acc, p) => acc + Number(p.preco), 0);

      const dados = {
        cliente: cliente,
        usuario: clienteLogado,
        endereco: endereco,
        itens: carrinho,
        total: total,
        pagamento: formaPagamento,
        troco: trocoPara ? `Para R$ ${trocoPara}` : 'Não precisa de troco'
      };

      if (socket) {
        socket.emit('novo_pedido', dados);
      } else {
        console.log('Pedido para envio:', dados);
      }

      alert('Pedido enviado com sucesso!');
      carrinho = [];
      atualizarCarrinho();
      toggleCarrinho();
      verificarPedidoAtivo();
    }

    function alternarDashCliente() {
      const dash = document.getElementById('dash-cliente');
      const visivel = dash.style.display === 'block';
      dash.style.display = visivel ? 'none' : 'block';
      if (!visivel) carregarHistoricoCliente();
    }

    async function carregarHistoricoCliente() {
      const user = document.getElementById('nome-cliente').value.trim() || clienteLogado;
      try {
        const res = await fetch(`/api/pedidos?usuario=${user}`);
        if (res.ok) {
          const meusPedidos = await res.json();
          renderizarHistorico(meusPedidos);
        } else {
          renderizarHistorico([]);
        }
      } catch (err) {
        renderizarHistorico([]);
      }
    }

    function renderizarHistorico(meusPedidos) {
      document.getElementById('cli-qtd-pedidos').innerText = meusPedidos.length;

      const totalGasto = meusPedidos.reduce((acc, p) => acc + Number(p.total), 0);
      document.getElementById('cli-total-gasto').innerText = totalGasto.toFixed(2);

      const container = document.getElementById('cli-lista-historico');
      if (meusPedidos.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted);">Você ainda não possui histórico de compras.</p>';
        return;
      }

      container.innerHTML = meusPedidos.slice().reverse().map(p => `
        <div style="border: 1px solid var(--border-color); padding: 14px; border-radius: 8px; margin-bottom: 10px; background: #ffffff; box-shadow: var(--shadow);">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong>Pedido #${p.id}</strong>
            <span style="color: var(--primary); font-weight: 600; font-size: 13px; background: #ecfdf5; padding: 2px 8px; border-radius: 4px;">${p.status || 'Pendente'}</span>
          </div>
          <p style="font-size: 13px; color: var(--text-muted); margin: 6px 0;">Data: ${p.data || 'Hoje'}</p>
          <p style="font-size: 14px;"><strong>Valor:</strong> R$ ${Number(p.total).toFixed(2)}</p>
        </div>
      `).join('');
    }

    function fazerLogout() {
      localStorage.removeItem('usuarioLogado');
      window.location.href = 'login.html';
    }

    if (socket) {
      socket.on('status_atualizado', (pedido) => {
        const user = document.getElementById('nome-cliente').value.trim() || clienteLogado;
        if (pedido.usuario && pedido.usuario.toLowerCase() === user.toLowerCase()) {
          statusPedidoAtual = pedido.status;
          const boxStatus = document.getElementById('box-status');
          if (pedido.status === 'Entregue' || pedido.status === 'Cancelado pelo Cliente') {
            boxStatus.style.display = 'none';
          } else {
            boxStatus.style.display = 'block';
            document.getElementById('status-pedido-id').innerText = `Pedido #${pedido.id}`;
            document.getElementById('status-pedido-texto').innerText = pedido.status;
          }
        }
      });
    }

    // Inicialização ao carregar a página
    carregarProdutos();
    verificarPedidoAtivo();
  </script>
</body>
</html>
