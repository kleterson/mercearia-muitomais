<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Informa ao celular que o site deve se comportar como aplicativo -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <title>Painel de Entregas (Motoboy)</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #f59e0b;
        --primary-dark: #d97706;
        --success: #10b981;
        --success-dark: #059669;
        --danger: #ef4444;
        --info: #3b82f6;
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --card-bg-alt: #334155;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --radius: 14px;
        --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
      }

      * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
      
      body { 
        padding: 16px; 
        background-color: var(--bg-color); 
        background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
        color: var(--text-main); 
        min-height: 100vh;
        max-width: 480px;
        margin: 0 auto;
      }
      
      .header-bar { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 20px; 
        background: var(--card-bg);
        padding: 14px 18px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--border-color);
      }

      .header-bar h1 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header-actions { display: flex; gap: 8px; align-items: center; }
      
      /* Botões do Topo */
      .btn-dash { 
        background: var(--card-bg-alt); 
        color: var(--text-main); 
        border: 1px solid var(--border-color); 
        padding: 8px 12px; 
        border-radius: 10px; 
        font-weight: 600; 
        cursor: pointer; 
        display: flex; 
        align-items: center; 
        gap: 6px; 
        font-size: 13px;
        transition: background 0.2s;
      }
      .btn-dash:hover { background: #475569; }

      .btn-cancelados-topo { 
        background: rgba(239, 68, 68, 0.15); 
        color: #fca5a5; 
        border: 1px solid rgba(239, 68, 68, 0.3); 
        padding: 8px 12px; 
        border-radius: 10px; 
        font-weight: 600; 
        cursor: pointer; 
        display: flex; 
        align-items: center; 
        gap: 6px; 
        text-decoration: none; 
        font-size: 13px;
        transition: background 0.2s;
      }
      .btn-cancelados-topo:hover { background: rgba(239, 68, 68, 0.25); }
      
      /* Painel Expansível (Dashboard Modal/Gaveta) */
      #painel-historico { 
        display: none; 
        background: var(--card-bg); 
        border: 1px solid var(--border-color); 
        border-radius: var(--radius); 
        padding: 20px; 
        margin-bottom: 25px; 
        box-shadow: var(--shadow);
        animation: fadeIn 0.2s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      /* Cards de Resumo */
      .dash-metrics { display: flex; justify-content: center; margin: 15px 0; }
      .metric-card { 
        width: 100%; 
        max-width: 400px; 
        background: var(--card-bg-alt); 
        padding: 16px; 
        border-radius: 12px; 
        text-align: center; 
        border: 1px solid var(--border-color);
      }
      .metric-card h3 { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
      .metric-card p { font-size: 26px; font-weight: 700; color: var(--primary); }
      
      /* Títulos das Seções */
      h2:not(.header-bar h2) {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Cards de Pedidos */
      .card { 
        background: var(--card-bg); 
        border-left: 5px solid var(--primary); 
        padding: 18px; 
        border-radius: var(--radius); 
        margin-bottom: 16px; 
        box-shadow: var(--shadow);
        border-top: 1px solid var(--border-color);
        border-right: 1px solid var(--border-color);
        border-bottom: 1px solid var(--border-color);
      }
      .card h2 {
        color: var(--text-main);
        font-size: 18px;
        margin-bottom: 10px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 8px;
        text-transform: none;
      }
      .card p {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 6px;
        line-height: 1.4;
      }
      .card p strong {
        color: var(--text-main);
      }

      .card-historico { border-left-color: var(--success); background: var(--card-bg); }
      
      .btn { 
        width: 100%; 
        padding: 13px; 
        border: none; 
        border-radius: 10px; 
        cursor: pointer; 
        font-weight: 600; 
        margin-top: 14px; 
        font-size: 15px; 
        transition: filter 0.2s, transform 0.1s;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
      }
      .btn:active { transform: scale(0.98); }
      .btn:hover { filter: brightness(1.1); }

      .btn-aceitar { background: var(--primary); color: #0f172a; }
      .btn-caminho { background: var(--info); color: white; }
      .btn-entregue { background: var(--success); color: white; }
      
      .status-badge { 
        background: rgba(59, 130, 246, 0.15); 
        color: #93c5fd; 
        padding: 6px 12px; 
        border-radius: 8px; 
        display: inline-block; 
        margin-top: 10px; 
        font-weight: 600; 
        font-size: 13px;
        border: 1px solid rgba(59, 130, 246, 0.3);
      }
    </style>
</head>
<body>

  <div class="header-bar">
    <h1>🛵 Painel Motoboy</h1>
    <div class="header-actions">
      <button class="btn-dash" onclick="alternarHistorico()">📊 Histórico</button>
      <a href="cancelados.html" class="btn-cancelados-topo">❌ Cancelados</a>
    </div>
  </div>

  <!-- Janela Expansível do Histórico -->
  <div id="painel-historico">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
      <h2 style="margin:0; color:var(--text-main); font-size:16px;">📈 Dashboard & Histórico</h2>
      <button onclick="alternarHistorico()" style="background:transparent; border:none; color:var(--text-muted); font-size:20px; cursor:pointer; padding: 4px;">✖</button>
    </div>

    <div class="dash-metrics">
      <div class="metric-card">
        <h3>Entregas Concluídas</h3>
        <p id="total-entregas-qtd">0</p>
      </div>
    </div>

    <h3 style="margin-bottom: 10px; font-size: 13px; color: var(--text-muted); text-transform: uppercase;">Lista de Pedidos Entregues:</h3>
    <div id="lista-historico"><p style="color:var(--text-muted); font-size: 14px;">Nenhuma entrega realizada ainda.</p></div>
  </div>

  <h2>Entregas Ativas</h2>
  <div id="lista-pedidos" style="margin-top: 10px;"></div>

  <script>
    const socket = io();
    let historicoVisivel = false;

    function alternarHistorico() {
      const painel = document.getElementById('painel-historico');
      historicoVisivel = !historicoVisivel;
      painel.style.display = historicoVisivel ? 'block' : 'none';
      if (historicoVisivel) carregarHistorico();
    }

    async function carregarPedidos() {
      const res = await fetch('/api/pedidos');
      const pedidos = await res.json();
      document.getElementById('lista-pedidos').innerHTML = '';
      
      // Filtra para remover Entregues, Aguardando, Em Preparo e Pedidos Cancelados da tela principal
      const ativos = pedidos.filter(p => 
        p.status !== 'Entregue' && 
        p.status !== 'Aguardando Aprovação' && 
        p.status !== 'Em Preparo / Aceito' &&
        p.status !== 'Cancelado pelo Cliente'
      );
      
      if (ativos.length === 0) {
        document.getElementById('lista-pedidos').innerHTML = '<p style="color:var(--text-muted); font-size:14px; background:var(--card-bg); padding:20px; border-radius:var(--radius); text-align:center; border:1px solid var(--border-color);">Nenhuma corrida pendente no momento.</p>';
      } else {
        ativos.reverse().forEach(p => renderizarCardAtivo(p));
      }
    }

    async function carregarHistorico() {
      const res = await fetch('/api/pedidos');
      const pedidos = await res.json();
      const entregues = pedidos.filter(p => p.status === 'Entregue');

      document.getElementById('total-entregas-qtd').innerText = entregues.length;

      const containerHistorico = document.getElementById('lista-historico');
      if (entregues.length === 0) {
        containerHistorico.innerHTML = '<p style="color:var(--text-muted); font-size: 14px;">Nenhuma entrega concluída até o momento.</p>';
      } else {
        containerHistorico.innerHTML = entregues.reverse().map(p => {
          const formaPag = p.pagamento || p.formaPagamento || 'Não especificado';
          const infoTroco = p.troco ? ` - Troco: ${p.troco}` : '';
          return `
            <div class="card card-historico">
              <h2>Pedido #${p.id}</h2>
              <p><strong>Cliente:</strong> ${p.cliente}</p>
              <p><strong>Endereço:</strong> ${p.endereco}</p>
              <p><strong>Valor:</strong> R$ ${Number(p.total).toFixed(2)}</p>
              <p><strong>Pagamento:</strong> <span style="color: var(--primary); font-weight: 600;">${formaPag}${infoTroco}</span></p>
              <div class="status-badge" style="background:rgba(16, 185, 129, 0.15); color:#6ee7b7; border-color:rgba(16, 185, 129, 0.3);">Status: Entregue ✅</div>
            </div>
          `;
        }).join('');
      }
    }

    function renderizarCardAtivo(p) {
      if (document.getElementById(`pedido-${p.id}`)) {
        atualizarBotoes(p);
        return;
      }

      const formaPag = p.pagamento || p.formaPagamento || 'Não especificado';
      const infoTroco = p.troco ? ` - Troco: ${p.troco}` : '';

      const div = document.createElement('div');
      div.className = 'card';
      div.id = `pedido-${p.id}`;

      div.innerHTML = `
        <h2>Pedido #${p.id}</h2>
        <p><strong>Cliente:</strong> ${p.cliente}</p>
        <p><strong>Endereço:</strong> ${p.endereco}</p>
        <p><strong>Valor:</strong> R$ ${Number(p.total).toFixed(2)}</p>
        <p><strong>Pagamento:</strong> <span style="color: var(--primary); font-weight: 600;">${formaPag}${infoTroco}</span></p>
        <div class="status-badge" id="badge-${p.id}">${p.status}</div>
        <div id="acoes-${p.id}"></div>
      `;

      document.getElementById('lista-pedidos').prepend(div);
      atualizarBotoes(p);
    }

    function atualizarBotoes(p) {
      const containerAcoes = document.getElementById(`acoes-${p.id}`);
      if (!containerAcoes) return;

      const st = p.status.trim();

      if (st === 'Aguardando Aceite do Motoboy') {
        containerAcoes.innerHTML = `<button class="btn btn-aceitar" onclick="aceitarCorrida(${p.id})">Aceitar Corrida 🛵</button>`;
      } 
      else if (st === 'Motoboy Aceitou (Indo ao Comércio)' || st === 'A caminho do endereço') {
        containerAcoes.innerHTML = `<button class="btn btn-caminho" onclick="iniciarEntrega(${p.id})">Coletar Pedido / Saiu para entregar 📦</button>`;
      } 
      else if (st.includes('Saiu para entregar') || st.includes('caminho do seu endereço')) {
        containerAcoes.innerHTML = `<button class="btn btn-entregue" onclick="marcarEntregue(${p.id})">Marcar como Entregue ✅</button>`;
      }
    }

    function aceitarCorrida(id) {
      socket.emit('motoboy_aceitou', id);
    }

    function iniciarEntrega(id) {
      socket.emit('motoboy_a_caminho', id);
    }

    function marcarEntregue(id) {
      socket.emit('confirmar_entrega', id);
    }

    socket.on('pedido_disponivel_motoboy', (pedido) => {
      carregarPedidos();
    });

    socket.on('status_atualizado', (p) => {
      const badge = document.getElementById(`badge-${p.id}`);
      if (badge) badge.innerText = p.status;

      if (p.status === 'Entregue' || p.status === 'Cancelado pelo Cliente') {
        const card = document.getElementById(`pedido-${p.id}`);
        if (card) card.remove();
        if (historicoVisivel) carregarHistorico();
      } else {
        atualizarBotoes(p);
      }
    });

    carregarPedidos();
  </script>
</body>
</html>
